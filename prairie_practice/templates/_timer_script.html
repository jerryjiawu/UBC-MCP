{% if inst.remaining_s is not none %}
<script>
(() => {
  const el = document.getElementById("timer");
  const bar = document.getElementById("timer-bar");
  let left = +el.dataset.remaining;
  const total = +el.dataset.total;
  const tick = () => {
    const m = Math.floor(left / 60), s = left % 60;
    document.getElementById("timer-text").textContent = m + " min " + String(s).padStart(2, "0") + " s";
    if (bar) {
      bar.style.width = (100 * left / total) + "%";
      bar.className = "progress-bar " + (left < 300 ? "bg-danger" : left < 900 ? "bg-warning" : "bg-primary");
    }
    if (left <= 0) { location.reload(); return; }
    left -= 1;
  };
  tick();
  setInterval(tick, 1000);
})();
</script>
{% endif %}
