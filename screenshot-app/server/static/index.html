<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Screenshots</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screenshots">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-180.png">
<style>
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --surface-2: #eceef3;
    --text: #12141a;
    --muted: #6b7180;
    --border: rgba(18, 20, 26, 0.08);
    --accent: #3b5bfd;
    --accent-text: #ffffff;
    --danger: #d93a3a;
    --ok: #1fa45a;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --surface: #161922;
      --surface-2: #1f2330;
      --text: #f2f3f7;
      --muted: #8b91a1;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #5b7bff;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right))
             calc(env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left));
  }

  /* ---- Setup ---- */
  #setup { min-height: 100%; display: flex; align-items: center; }
  #setup .wrap { width: 100%; }
  .setup-card { background: var(--surface); border-radius: var(--radius); padding: 28px 22px; box-shadow: var(--shadow); text-align: center; }
  .setup-card img { width: 72px; height: 72px; border-radius: 16px; }
  .setup-card h1 { font-size: 24px; margin: 14px 0 6px; }
  .setup-card p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
  .field {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font: 16px ui-monospace, "SF Mono", Menlo, monospace;
  }
  .field:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .error { color: var(--danger); font-size: 14px; min-height: 20px; margin: 10px 0 4px; }

  /* ---- Header ---- */
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  header .titles { flex: 1; min-width: 0; }
  header h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.off { background: var(--danger); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); box-shadow: var(--shadow); color: var(--text);
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Preview ---- */
  .preview {
    position: relative; background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
    aspect-ratio: 16 / 10; display: grid; place-items: center;
  }
  .preview img { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--surface-2); }
  .preview .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 15px; }
  .empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
  .meta { color: var(--muted); font-size: 13px; margin: 10px 4px 14px; display: flex; justify-content: space-between; gap: 8px; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 52px; border-radius: 14px; font-weight: 600; font-size: 16px;
    background: var(--surface); box-shadow: var(--shadow); transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; }
  .btn.primary { background: var(--accent); color: var(--accent-text); box-shadow: none; }
  .btn svg { width: 20px; height: 20px; }
  .btn.block { width: 100%; }

  /* ---- OCR text ---- */
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 10px; }
  .section-head h2 { margin: 0 4px; }
  .chip {
    display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    border-radius: 999px; font-size: 14px; font-weight: 600;
    background: var(--surface); box-shadow: var(--shadow); color: var(--accent);
  }
  .chip svg { width: 15px; height: 15px; }
  .chip:disabled { opacity: .45; }
  .ocr {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
    padding: 14px 16px; max-height: 45vh; overflow: auto; -webkit-overflow-scrolling: touch;
    font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
    -webkit-user-select: text; user-select: text;
  }
  .ocr-status { color: var(--muted); font-size: 14px; padding: 0 4px; }
  .ocr-status:empty { display: none; }

  /* ---- History ---- */
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 26px 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .thumb {
    position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden;
    background: var(--surface-2); outline: 2.5px solid transparent; outline-offset: -2.5px;
  }
  .thumb.selected { outline-color: var(--accent); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb span {
    position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600;
    padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff;
  }

  /* ---- Full-screen viewer ---- */
  #viewer {
    position: fixed; inset: 0; z-index: 20; background: #000;
    display: flex; flex-direction: column;
  }
  #viewer .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; color: #fff; font-size: 13px;
  }
  #viewer .bar .icon-btn { background: rgba(255,255,255,.14); color: #fff; box-shadow: none; }
  #viewer .stage { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; display: grid; }
  #viewer .stage img { margin: auto; display: block; }
  #viewer .stage.fit img { max-width: 100%; max-height: 100%; }
  #viewer .hint { color: rgba(255,255,255,.55); }
  #viewer .actions { padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); }
  #viewer .btn:not(.primary) { background: rgba(255,255,255,.14); color: #fff; box-shadow: none; }

  /* ---- Toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); z-index: 30;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: rgba(20,22,30,.92); color: #fff; padding: 11px 18px; border-radius: 999px;
    font-size: 15px; font-weight: 500; transition: opacity .2s, transform .2s;
    max-width: calc(100% - 32px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<!-- First-launch: enter API key -->
<section id="setup" hidden>
  <div class="wrap">
    <form class="setup-card" id="setup-form" autocomplete="off">
      <img src="/icon-180.png" alt="">
      <h1>Screenshots</h1>
      <p>Paste the API key you set as <code>API_SECRET</code> on the server. It's stored only on this device.</p>
      <input class="field" id="key-input" type="password" placeholder="API key" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <div class="error" id="setup-error"></div>
      <button class="btn primary block" type="submit" id="connect-btn">Connect</button>
    </form>
  </div>
</section>

<!-- Main screen -->
<main id="app" hidden>
  <div class="wrap">
    <header>
      <div class="titles">
        <h1>Screenshots</h1>
        <div class="status"><span class="dot" id="dot"></span><span id="status-text">Connecting…</span></div>
      </div>
      <button class="icon-btn" id="refresh-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div class="preview" id="preview">
      <img id="preview-img" alt="Selected screenshot" hidden>
      <div class="loading" id="preview-loading" hidden>Loading…</div>
      <div class="empty" id="empty" hidden>
        <strong>No screenshots yet</strong>
        Press Win+PrtScn on your PC and it'll show up here.
      </div>
    </div>
    <div class="meta"><span id="meta-time">&nbsp;</span><span id="meta-size"></span></div>

    <div class="actions">
      <button class="btn primary" id="copy-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
      <button class="btn" id="save-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
        Save / Share
      </button>
    </div>

    <section id="text-section" hidden>
      <div class="section-head">
        <h2>Text</h2>
        <button class="chip" id="copy-text-btn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy text
        </button>
      </div>
      <div class="ocr" id="ocr-text" hidden></div>
      <div class="ocr-status" id="ocr-status"></div>
    </section>

    <h2 id="recent-heading" hidden>Recent</h2>
    <div class="grid" id="grid"></div>
  </div>
</main>

<!-- Full-screen viewer -->
<div id="viewer" hidden>
  <div class="bar">
    <button class="icon-btn" id="viewer-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <span class="hint" id="viewer-hint">Tap image to zoom</span>
  </div>
  <div class="stage fit" id="viewer-stage"><img id="viewer-img" alt="Screenshot full screen"></div>
  <div class="actions">
    <button class="btn primary" data-action="copy">Copy</button>
    <button class="btn" data-action="save">Save / Share</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const KEY_STORAGE = "screenshot-api-key";
  const POLL_MS = 2000;

  const $ = (id) => document.getElementById(id);
  const els = {
    setup: $("setup"), setupForm: $("setup-form"), keyInput: $("key-input"),
    setupError: $("setup-error"), connectBtn: $("connect-btn"),
    app: $("app"), dot: $("dot"), statusText: $("status-text"),
    refreshBtn: $("refresh-btn"), settingsBtn: $("settings-btn"),
    previewImg: $("preview-img"), previewLoading: $("preview-loading"), empty: $("empty"),
    metaTime: $("meta-time"), metaSize: $("meta-size"),
    copyBtn: $("copy-btn"), saveBtn: $("save-btn"),
    textSection: $("text-section"), copyTextBtn: $("copy-text-btn"),
    ocrText: $("ocr-text"), ocrStatus: $("ocr-status"),
    recentHeading: $("recent-heading"), grid: $("grid"),
    viewer: $("viewer"), viewerStage: $("viewer-stage"), viewerImg: $("viewer-img"),
    viewerHint: $("viewer-hint"), viewerClose: $("viewer-close"),
    toast: $("toast"),
  };

  class AuthError extends Error {}

  const state = {
    key: null,
    items: [],          // [{id, mimetype, uploaded_at, size, text}], newest first
    selectedId: null,
    cache: new Map(),   // id -> {promise, blob, url, png}
    online: true,
    lastSync: 0,
    refreshing: false,
  };

  // ---------- storage ----------
  function loadKey() {
    try { return localStorage.getItem(KEY_STORAGE); } catch { return null; }
  }
  function saveKey(key) {
    try { key ? localStorage.setItem(KEY_STORAGE, key) : localStorage.removeItem(KEY_STORAGE); } catch {}
  }

  // ---------- network ----------
  async function api(path) {
    const res = await fetch(path, { headers: { "X-API-Key": state.key }, cache: "no-store" });
    if (res.status === 401) throw new AuthError("Invalid API key.");
    if (!res.ok) throw new Error(`Server returned ${res.status}.`);
    return res;
  }

  function loadImage(id) {
    let entry = state.cache.get(id);
    if (!entry) {
      entry = {};
      entry.promise = api(`/screenshots/${id}`)
        .then((r) => r.blob())
        .then((blob) => {
          entry.blob = blob;
          entry.url = URL.createObjectURL(blob);
          return entry;
        })
        .catch((e) => { state.cache.delete(id); throw e; });
      state.cache.set(id, entry);
    }
    return entry.promise;
  }

  // iOS's clipboard only reliably accepts PNG, so convert anything else.
  function pngBlob(entry) {
    if (!entry.png) {
      entry.png = entry.blob.type === "image/png"
        ? Promise.resolve(entry.blob)
        : new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              const c = document.createElement("canvas");
              c.width = img.naturalWidth; c.height = img.naturalHeight;
              c.getContext("2d").drawImage(img, 0, 0);
              c.toBlob((b) => (b ? resolve(b) : reject(new Error("PNG conversion failed"))), "image/png");
            };
            img.onerror = () => reject(new Error("Couldn't decode image"));
            img.src = entry.url;
          });
    }
    return entry.png;
  }

  async function refresh({ manual = false } = {}) {
    if (state.refreshing || !state.key) return;
    state.refreshing = true;
    if (manual) els.refreshBtn.classList.add("spin");
    try {
      const data = await (await api("/screenshots")).json();
      const prevNewest = state.items[0]?.id ?? null;
      state.items = data.screenshots || [];
      state.online = true;
      state.lastSync = Date.now();

      const newest = state.items[0]?.id ?? null;
      const stillThere = state.items.some((s) => s.id === state.selectedId);
      // Follow new uploads if the user was looking at the newest one;
      // otherwise leave their selection alone and just let them know.
      if (!stillThere || state.selectedId === prevNewest) {
        state.selectedId = newest;
      } else if (newest !== prevNewest && prevNewest !== null) {
        toast("New screenshot available");
      }

      // Drop cached images that have aged out of the server's history.
      for (const [id, entry] of state.cache) {
        if (!state.items.some((s) => s.id === id)) {
          if (entry.url) URL.revokeObjectURL(entry.url);
          state.cache.delete(id);
        }
      }
      render();
      if (manual) toast(state.items.length ? "Up to date" : "No screenshots yet");
    } catch (e) {
      if (e instanceof AuthError) { signOut("That API key was rejected. Enter it again."); return; }
      state.online = false;
      renderStatus();
      if (manual) toast("Can't reach the server");
    } finally {
      state.refreshing = false;
      els.refreshBtn.classList.remove("spin");
    }
  }

  // ---------- rendering ----------
  function relTime(sec) {
    const diff = Math.max(0, Date.now() / 1000 - sec);
    if (diff < 10) return "just now";
    if (diff < 60) return `${Math.floor(diff)}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)} min ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} hr ago`;
    return new Date(sec * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function clockTime(sec) {
    const d = new Date(sec * 1000);
    const sameDay = d.toDateString() === new Date().toDateString();
    const time = d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    return sameDay ? `Today, ${time}` : `${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}, ${time}`;
  }
  function fmtSize(bytes) {
    return bytes < 1024 * 1024 ? `${Math.round(bytes / 1024)} KB` : `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  }

  function selected() { return state.items.find((s) => s.id === state.selectedId) || null; }

  function renderStatus() {
    els.dot.classList.toggle("off", !state.online);
    if (!state.online) {
      els.statusText.textContent = "Offline — retrying";
    } else if (state.items[0]) {
      els.statusText.textContent = `Latest ${relTime(state.items[0].uploaded_at)}`;
    } else {
      els.statusText.textContent = "Connected";
    }
  }

  function render() {
    renderStatus();
    const item = selected();
    els.empty.hidden = !!item;
    els.copyBtn.disabled = els.saveBtn.disabled = !item;

    if (!item) {
      els.previewImg.hidden = true;
      els.previewLoading.hidden = true;
      els.metaTime.innerHTML = "&nbsp;";
      els.metaSize.textContent = "";
    } else {
      els.metaTime.textContent = clockTime(item.uploaded_at);
      els.metaSize.textContent = fmtSize(item.size);
      const entry = state.cache.get(item.id);
      if (entry?.url) {
        showPreview(entry, item);
      } else {
        els.previewImg.hidden = true;
        els.previewLoading.hidden = false;
        loadImage(item.id)
          .then((e) => { if (state.selectedId === item.id) showPreview(e, item); })
          .catch(() => { if (state.selectedId === item.id) els.previewLoading.textContent = "Couldn't load image"; });
      }
    }
    renderText(item);
    renderGrid();
  }

  // OCR text arrives a second or two after the image (the PC uploads the
  // image first, then the recognized text), so show a pending state meanwhile.
  const OCR_WAIT_SECONDS = 60;
  let renderedText = null;
  function renderText(item) {
    els.textSection.hidden = !item;
    if (!item) { renderedText = null; return; }

    const text = item.text;
    const hasText = typeof text === "string" && text.trim() !== "";
    els.copyTextBtn.disabled = !hasText;
    els.ocrText.hidden = !hasText;

    // Only touch the DOM when the text actually changes, so polling doesn't
    // wipe out a selection the user is in the middle of making.
    const key = `${item.id}\u0000${text}`;
    if (hasText && renderedText !== key) els.ocrText.textContent = text;
    renderedText = key;

    if (hasText) {
      els.ocrStatus.textContent = "";
    } else if (typeof text === "string") {
      els.ocrStatus.textContent = "No text found in this screenshot.";
    } else if (Date.now() / 1000 - item.uploaded_at < OCR_WAIT_SECONDS) {
      els.ocrStatus.textContent = "Reading text…";
    } else {
      els.ocrStatus.textContent = "Text isn't available for this screenshot.";
    }
  }

  function copyText() {
    const text = selected()?.text;
    if (!text) return;
    if (!navigator.clipboard?.writeText) {
      toast("Copy isn't supported here — select the text instead");
      return;
    }
    navigator.clipboard.writeText(text)
      .then(() => toast("Text copied"))
      .catch((e) => toast(`Couldn't copy: ${e.message || e}`));
  }

  function showPreview(entry, item) {
    els.previewLoading.hidden = true;
    els.previewLoading.textContent = "Loading…";
    if (els.previewImg.src !== entry.url) {
      els.previewImg.onload = () => {
        const { naturalWidth: w, naturalHeight: h } = els.previewImg;
        if (state.selectedId === item.id) els.metaSize.textContent = `${w}×${h} · ${fmtSize(item.size)}`;
      };
      els.previewImg.src = entry.url;
    }
    els.previewImg.hidden = false;
  }

  function renderGrid() {
    const showGrid = state.items.length > 1;
    els.recentHeading.hidden = !showGrid;
    els.grid.replaceChildren();
    if (!showGrid) return;

    state.items.forEach((item, i) => {
      const btn = document.createElement("button");
      btn.className = "thumb" + (item.id === state.selectedId ? " selected" : "");
      btn.setAttribute("aria-label", `Screenshot from ${clockTime(item.uploaded_at)}`);
      const label = document.createElement("span");
      label.textContent = i === 0 ? "Latest" : relTime(item.uploaded_at);
      const img = document.createElement("img");
      img.alt = "";
      btn.append(img, label);
      const entry = state.cache.get(item.id);
      if (entry?.url) img.src = entry.url;
      else loadImage(item.id).then((e) => { img.src = e.url; }).catch(() => {});
      btn.addEventListener("click", () => {
        state.selectedId = item.id;
        render();
      });
      els.grid.append(btn);
    });
  }

  // ---------- actions ----------
  let toastTimer;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);
  }

  function readyEntry() {
    const item = selected();
    const entry = item && state.cache.get(item.id);
    if (!entry?.blob) { toast("Still loading — try again in a second"); return null; }
    return { item, entry };
  }

  // Both actions must start synchronously inside the tap handler — iOS only
  // allows clipboard writes and the share sheet during a user gesture.
  function copySelected() {
    const ready = readyEntry();
    if (!ready) return;
    if (!navigator.clipboard?.write || typeof ClipboardItem === "undefined") {
      toast("Copy isn't supported here — long-press the image instead");
      return;
    }
    navigator.clipboard
      .write([new ClipboardItem({ "image/png": pngBlob(ready.entry) })])
      .then(() => toast("Copied to clipboard"))
      .catch((e) => toast(`Couldn't copy: ${e.message || e}`));
  }

  function saveSelected() {
    const ready = readyEntry();
    if (!ready) return;
    const { item, entry } = ready;
    const d = new Date(item.uploaded_at * 1000);
    const pad = (n) => String(n).padStart(2, "0");
    const ext = entry.blob.type === "image/jpeg" ? "jpg" : "png";
    const name = `Screenshot ${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}.${pad(d.getMinutes())}.${pad(d.getSeconds())}.${ext}`;
    const file = new File([entry.blob], name, { type: entry.blob.type || "image/png" });

    if (navigator.canShare?.({ files: [file] })) {
      navigator.share({ files: [file] }).catch((e) => {
        if (e.name !== "AbortError") toast(`Couldn't share: ${e.message || e}`);
      });
    } else {
      const a = document.createElement("a");
      a.href = entry.url;
      a.download = name;
      a.click();
    }
  }

  function openViewer() {
    const ready = readyEntry();
    if (!ready) return;
    els.viewerImg.src = ready.entry.url;
    setZoom(false);
    els.viewer.hidden = false;
  }
  function closeViewer() { els.viewer.hidden = true; }

  function setZoom(zoomed, tapX = 0.5, tapY = 0.5) {
    const stage = els.viewerStage, img = els.viewerImg;
    stage.classList.toggle("fit", !zoomed);
    els.viewerHint.textContent = zoomed ? "Tap to fit" : "Tap image to zoom";
    if (!zoomed) { img.style.width = ""; return; }
    // Show the image at native pixel density (but at least 2x the screen width)
    // and scroll so the tapped spot stays roughly under the finger.
    const width = Math.max(img.naturalWidth / (window.devicePixelRatio || 1), stage.clientWidth * 2);
    img.style.width = `${width}px`;
    requestAnimationFrame(() => {
      stage.scrollLeft = tapX * stage.scrollWidth - stage.clientWidth / 2;
      stage.scrollTop = tapY * stage.scrollHeight - stage.clientHeight / 2;
    });
  }

  // ---------- auth flow ----------
  function showSetup(message = "") {
    els.app.hidden = true;
    els.viewer.hidden = true;
    els.setup.hidden = false;
    els.setupError.textContent = message;
    els.keyInput.value = "";
  }

  function showApp() {
    els.setup.hidden = true;
    els.app.hidden = false;
  }

  function signOut(message) {
    state.key = null;
    state.items = [];
    state.selectedId = null;
    for (const entry of state.cache.values()) if (entry.url) URL.revokeObjectURL(entry.url);
    state.cache.clear();
    saveKey(null);
    showSetup(message);
  }

  els.setupForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const key = els.keyInput.value.trim();
    if (!key) return;
    els.connectBtn.disabled = true;
    els.connectBtn.textContent = "Connecting…";
    els.setupError.textContent = "";
    try {
      state.key = key;
      await api("/screenshots");
      saveKey(key);
      showApp();
      await refresh();
    } catch (e) {
      state.key = null;
      els.setupError.textContent = e instanceof AuthError
        ? "That key was rejected — check it matches API_SECRET."
        : "Couldn't reach the server. Check your connection.";
    } finally {
      els.connectBtn.disabled = false;
      els.connectBtn.textContent = "Connect";
    }
  });

  // ---------- wiring ----------
  els.refreshBtn.addEventListener("click", () => refresh({ manual: true }));
  els.settingsBtn.addEventListener("click", () => {
    if (confirm("Forget the saved API key on this device?")) signOut();
  });
  els.copyBtn.addEventListener("click", copySelected);
  els.saveBtn.addEventListener("click", saveSelected);
  els.copyTextBtn.addEventListener("click", copyText);
  els.previewImg.addEventListener("click", openViewer);
  els.viewerClose.addEventListener("click", closeViewer);
  els.viewerImg.addEventListener("click", (ev) => {
    const zoomed = els.viewerStage.classList.contains("fit");
    const r = els.viewerImg.getBoundingClientRect();
    setZoom(zoomed, (ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height);
  });
  els.viewer.querySelector('[data-action="copy"]').addEventListener("click", copySelected);
  els.viewer.querySelector('[data-action="save"]').addEventListener("click", saveSelected);
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeViewer(); });

  // Poll while visible; refresh immediately when the app comes back to the foreground.
  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, POLL_MS);
  setInterval(renderStatus, 15000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
  window.addEventListener("pageshow", () => refresh());

  state.key = loadKey();
  if (state.key) { showApp(); refresh(); } else { showSetup(); }
})();
</script>
</body>
</html>
