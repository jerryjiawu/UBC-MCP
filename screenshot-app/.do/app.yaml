# DigitalOcean App Platform spec.
# Use this with `doctl apps create --spec .do/app.yaml` after editing the
# `repo` field below, OR just skip this file entirely and configure the same
# settings by hand in the App Platform web UI (see ../README.md).
name: screenshot-app
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
      branch: main
      deploy_on_push: true
    source_dir: screenshot-app/server
    environment_slug: python
    run_command: gunicorn app:app --bind 0.0.0.0:8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: API_SECRET
        scope: RUN_TIME
        type: SECRET
        value: "REPLACE_IN_DASHBOARD"
