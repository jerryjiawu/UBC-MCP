<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WATCHDOG</title>
<style>
  @font-face { font-family: "Orbitron"; src: url("fonts/Orbitron.ttf") format("truetype"); font-weight: 400 900; }
  :root {
    --bg: #0c0c0c; --text: #f2f2f2; --muted: #7d7d7d; --faint: #2a2a2a;
    --accent: #4fa8ff; --red: #ff6159;
    --art: rgba(255, 255, 255, .26);
    --mono: "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Orbitron", "Segoe UI", sans-serif; user-select: none; }
  body { background: radial-gradient(120% 90% at 22% 60%, #161616 0%, var(--bg) 60%); }
  body.on { --art: rgba(160, 205, 255, .8); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
  [hidden] { display: none !important; }

  /* Frieren: the PNG is a mask, so its colour follows --art */
  .art { position: absolute; left: -2%; bottom: 0; width: 63%; height: 100%;
    background: var(--art); transition: background 1.2s ease;
    /* luminance: white = drawn, black = empty, so a plain white-on-black image
       works as-is (a transparent PNG with white lines works too) */
    mask-image: url("img/frieren-mask.png"), linear-gradient(90deg, #fff 48%, transparent 90%);
    mask-mode: luminance, alpha; mask-composite: intersect;
    mask-size: cover, 100% 100%; mask-position: 35% 100%, 0 0; mask-repeat: no-repeat; }
  /* coloured parts of the art (e.g. blue eyes), extracted at load and drawn in
     their own colours on top of the tinted lines -- same box, crop and fade */
  .art-color { position: absolute; left: -2%; bottom: 0; width: 63%; height: 100%;
    object-fit: cover; object-position: 35% 100%;
    mask-image: linear-gradient(90deg, #fff 48%, transparent 90%); pointer-events: none; }
  /* colours are shown exactly as drawn: no dimming, no pulsing */
  .on .art { animation: breathe 6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .82; } }

  .titlebar { position: absolute; inset: 0 0 auto 0; height: 40px; z-index: 3; display: flex;
    justify-content: flex-end; align-items: center; gap: 2px; padding-right: 10px; }
  .titlebar button { width: 34px; height: 26px; color: var(--muted); font: 14px var(--mono); border-radius: 6px; }
  .titlebar button:hover { color: var(--text); background: #ffffff10; }
  .titlebar button.x:hover { color: #fff; background: #c42b1c; }

  .panel { position: absolute; z-index: 2; top: 0; right: 0; bottom: 0; width: min(470px, 52%);
    padding: 46px 44px 30px 10px; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: baseline; gap: 10px; }
  h1 { margin: 0; font-weight: 900; font-size: 44px; letter-spacing: .08em; line-height: 1; }
  .ver { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .1em; }
  .tagline { margin: 10px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .32em; text-transform: uppercase; }

  .clock { margin-top: auto; }
  .eyebrow { font-size: 10px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
  .on .eyebrow { color: var(--accent); }
  .time { margin-top: 8px; font-weight: 800; font-size: 74px; letter-spacing: .03em; line-height: 1;
    font-variant-numeric: tabular-nums; color: #4a4a4a; transition: color .5s, text-shadow .5s; }
  .on .time { color: var(--text); text-shadow: 0 0 26px #ffffff1f; }
  .seconds { margin-top: 10px; font: 12px var(--mono); color: var(--muted); letter-spacing: .1em; }
  .seconds b { color: var(--accent); font-weight: 400; }
  /* a quiet 60-tick second hand */
  .ticks { display: flex; gap: 3px; margin-top: 16px; height: 4px; }
  .ticks i { flex: 1; border-radius: 2px; background: var(--faint); transition: background .3s; }
  .ticks i.lit { background: #2d5f94; }
  .ticks i.head { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  .switch { margin-top: 30px; display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
    padding: 14px 16px; border: 1px solid #ffffff18; border-radius: 14px; background: #ffffff06;
    transition: border-color .3s, background .3s; }
  .switch:hover { border-color: #ffffff35; background: #ffffff0a; }
  .on .switch { border-color: #4fa8ff66; background: #4fa8ff0f; }
  .track { flex: none; position: relative; width: 58px; height: 30px; border-radius: 15px; background: #2b2b2b; transition: background .3s; }
  .knob { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #8a8a8a;
    transition: left .28s cubic-bezier(.4,1.5,.6,1), background .3s; }
  .on .track { background: var(--accent); }
  .on .knob { left: 32px; background: #121212; }
  .switch-text { display: grid; gap: 4px; }
  .switch-text strong { font-size: 14px; letter-spacing: .14em; }
  .switch-text span { font: 11px var(--mono); color: var(--muted); }
  .switch:disabled { opacity: .55; cursor: wait; }

  .modules { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 9px; font: 12px var(--mono); }
  .modules li { display: grid; grid-template-columns: 10px 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; color: var(--muted); }
  .modules li.soon { opacity: .5; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3a3a3a; }
  .dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.busy { background: var(--accent); animation: blink .6s steps(1) infinite; }
  .dot.fault { background: var(--red); box-shadow: 0 0 8px var(--red); }
  @keyframes blink { 50% { opacity: .2; } }
  .mod-name { color: var(--text); letter-spacing: .04em; }
  .mod-info { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fault .mod-info, li.fault .mod-info { color: var(--red); }
  .retry { border: 1px solid var(--red); color: var(--red); border-radius: 6px; padding: 1px 8px; font: 10px var(--mono); }

  .stats { display: flex; gap: 28px; margin-top: 22px; padding-top: 16px; border-top: 1px solid #ffffff12;
    font: 11px var(--mono); color: var(--muted); letter-spacing: .1em; }
  .reset { margin-left: auto; align-self: center; border: 1px solid #ffffff1c; border-radius: 8px; padding: 6px 12px;
    font: 11px var(--mono); color: var(--muted); letter-spacing: .06em; transition: color .2s, border-color .2s; }
  .reset:hover { color: var(--text); border-color: #ffffff40; }
  .reset.armed { color: var(--red); border-color: var(--red); }
  .stats b { display: block; margin-top: 4px; color: var(--text); font: 600 15px "Orbitron", sans-serif; letter-spacing: .06em; }

  @media (prefers-reduced-motion: reduce) { .on .art, .dot.busy { animation: none; } }
</style>
</head>
<body>
  <div class="art" aria-hidden="true"></div>
  <canvas class="art-color" id="art-color" aria-hidden="true"></canvas>

  <div class="titlebar">
    <button type="button" id="min" aria-label="Minimize">&#8211;</button>
    <button type="button" class="x" id="close" aria-label="Close">&#10005;</button>
  </div>

  <main class="panel">
    <div>
      <div class="brand"><h1>WATCHDOG</h1><span class="ver">V1</span></div>
      <p class="tagline">focus is a long journey</p>
    </div>

    <section class="clock" aria-live="off">
      <div class="eyebrow" id="eyebrow">Last session</div>
      <div class="time" id="time">00:00:00</div>
      <div class="seconds" id="seconds">T+ <b>0</b> s</div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
    </section>

    <button type="button" class="switch" id="toggle" aria-pressed="false">
      <span class="track"><span class="knob"></span></span>
      <span class="switch-text"><strong>STUDY MODE</strong><span id="mode-label">off · press space</span></span>
    </button>

    <ul class="modules">
      <li id="mod-lights"><span class="dot" id="led"></span><span class="mod-name">Lights</span>
        <span class="mod-info" id="status-text">connecting...</span><button type="button" class="retry" id="retry" hidden>retry</button></li>
      <li id="mod-phone"><span class="dot" id="phone-dot"></span><span class="mod-name">Phone</span>
        <span class="mod-info" id="phone-text">samsung · standing by</span><button type="button" class="retry" id="retry-phone" hidden>retry</button></li>
      <li id="mod-apps"><span class="dot" id="apps-dot"></span><span class="mod-name">Apps</span><span class="mod-info" id="apps-text">VS Code · allowed</span></li>
    </ul>

    <div class="stats">
      <div>LAST<b id="last">00:00:00</b></div>
      <div>TODAY<b id="today">00:00:00</b></div>
      <button type="button" class="reset" id="reset-today">reset today</button>
    </div>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  // Designed at 980x620; scale the whole page to fill whatever screen it's on.
  // Keep the art's coloured pixels (saturated: eyes etc.); white/grey lines and
  // background go transparent -- those are drawn by the tinted .art mask.
  (function extractArtColour() {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / img.naturalWidth);
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const canvas = $('art-color');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      // drawImage converts the file's colour profile (e.g. Display P3) to the screen's
      const data = ctx.getImageData(0, 0, w, h), px = data.data;
      const lines = new ImageData(new Uint8ClampedArray(px), w, h), lp = lines.data;
      // Same split as artsplit.py: each coloured pixel = white*e + colour*(1-e), so
      // anti-aliased edges between line and eye don't leave pale "residual white".
      const hist = new Uint32Array(256);
      let kept = 0;
      for (let i = 0; i < px.length; i += 4) {
        const hi = Math.max(px[i], px[i + 1], px[i + 2]), lo = Math.min(px[i], px[i + 1], px[i + 2]);
        if (hi - lo >= 40) { kept++; if (px[i + 3] > 230) hist[lo]++; }
      }
      const base = hist.indexOf(Math.max(...hist)); // the colour's own darkest channel
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i], g = px[i + 1], b = px[i + 2], a = px[i + 3];
        const hi = Math.max(r, g, b), lo = Math.min(r, g, b);
        if (hi - lo < 40) { px[i + 3] = 0; continue; }          // plain line work: lines layer only
        const e = Math.min(0.98, Math.max(0, (lo - base) / Math.max(1, 255 - base)));
        px[i] = (r - 255 * e) / (1 - e);                         // un-mix the white back out
        px[i + 1] = (g - 255 * e) / (1 - e);
        px[i + 2] = (b - 255 * e) / (1 - e);
        px[i + 3] = a * (1 - e);
        lp[i] = lp[i + 1] = lp[i + 2] = 255;                     // lines layer keeps only the white share
        lp[i + 3] = a * e;
      }
      ctx.putImageData(data, 0, 0);
      if (!kept) { canvas.hidden = true; return; } // plain black-and-white art: nothing to add
      const lc = document.createElement('canvas');
      lc.width = w; lc.height = h;
      lc.getContext('2d').putImageData(lines, 0, 0);
      document.querySelector('.art').style.maskImage =
        `url(${lc.toDataURL()}), linear-gradient(90deg, #fff 48%, transparent 90%)`;
    };
    img.src = 'img/frieren-mask.png';
  })();

  function fit() {
    document.documentElement.style.zoom = Math.max(0.6, Math.min(innerWidth / 980, innerHeight / 620));
  }
  fit();
  addEventListener('resize', fit);
  const ticks = Array.from({ length: 60 }, () => $('ticks').appendChild(document.createElement('i')));
  let state = null, offset = 0, busy = false;

  const hms = (s) => [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60]
    .map((v) => String(v).padStart(2, '0')).join(':');

  function elapsed() {
    if (!state.studying) return state.last_session;
    return Math.max(0, Math.floor(Date.now() / 1000 + offset - state.started_at));
  }

  function tick() {
    if (!state) return;
    const on = state.studying, s = elapsed();
    $('time').textContent = hms(s);
    $('seconds').innerHTML = `T+ <b>${s}</b> s`;
    $('today').textContent = hms(state.today_total + (on ? s : 0));
    $('last').textContent = hms(state.last_session);
    const sec = on ? s % 60 : -1;
    ticks.forEach((t, i) => { t.classList.toggle('lit', i < sec); t.classList.toggle('head', i === sec); });
  }

  function render(next) {
    state = next;
    offset = state.now - Date.now() / 1000;
    const on = state.studying, L = state.lights;
    document.body.classList.toggle('on', on);
    $('toggle').setAttribute('aria-pressed', String(on));
    $('mode-label').textContent = on ? 'on · lights set to study' : 'off · press space';
    $('eyebrow').textContent = on ? 'Studying' : 'Last session';
    $('led').className = 'dot ' + (L.busy ? 'busy' : L.ok === true ? 'ok' : L.ok === false ? 'fault' : '');
    $('mod-lights').classList.toggle('fault', L.ok === false);
    $('status-text').textContent = L.busy ? L.message : L.ok === false ? L.message
      : L.ok === true ? `jerry-nuc · ${on ? 'study' : 'relax'}` : 'jerry-nuc · standing by';
    $('status-text').title = L.message;
    const A = state.apps;
    const P = state.phone;
    $('phone-dot').className = 'dot ' + (P.busy ? 'busy' : P.ok === false ? 'fault' : P.ok === true && on ? 'ok' : '');
    $('mod-phone').classList.toggle('fault', P.ok === false);
    $('phone-text').textContent = P.busy ? 'samsung · sending ...' : P.ok === false ? P.message
      : P.ok === true ? `samsung · ${on ? 'locked' : 'unlocked'}` : 'samsung · standing by';
    $('phone-text').title = P.message;
    $('retry-phone').hidden = P.ok !== false;
    $('apps-dot').className = 'dot ' + (A.active ? 'ok' : '');
    const names = A.apps.join(', ');
    $('apps-text').textContent = !A.active ? `${names} · allowed`
      : A.blocks ? `${names} · blocked · closed ${A.blocks}x` : `${names} · blocked`;
    $('retry').hidden = L.ok !== false;
    tick();
  }

  async function toggle() {
    if (busy) return;
    busy = true; $('toggle').disabled = true;
    try { render(await window.pywebview.api.toggle()); }
    finally { busy = false; $('toggle').disabled = false; }
  }

  $('toggle').addEventListener('click', toggle);
  // two clicks: first arms it, second (within 3s) resets
  let resetTimer = null;
  $('reset-today').addEventListener('click', async () => {
    const btn = $('reset-today');
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = 'click again to reset';
      resetTimer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = 'reset today'; }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    btn.classList.remove('armed'); btn.textContent = 'reset today';
    render(await window.pywebview.api.reset_today());
  });
  $('retry-phone').addEventListener('click', async () => render(await window.pywebview.api.retry_phone()));
  $('retry').addEventListener('click', async () => render(await window.pywebview.api.retry_lights()));
  $('min').addEventListener('click', () => window.pywebview.api.minimize());
  $('close').addEventListener('click', () => window.pywebview.api.close());
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat && e.target.tagName !== 'BUTTON') { e.preventDefault(); toggle(); }
  });

  window.addEventListener('pywebviewready', async () => {
    render(await window.pywebview.api.get_state());
    setInterval(tick, 250);
    // SSH results finish in the background; pick them up
    setInterval(async () => { if (!busy) render(await window.pywebview.api.get_state()); }, 1000);
  });
</script>
</body>
</html>
